# Server Port (Binds dynamically to Vercel/Cloud injected PORT)
server.port=${PORT:8080}

# Spring Application Name
spring.application.name=job-seeking-platform-backend

# Neon PostgreSQL Database Configuration
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://ep-young-pine-b36d1w81-pooler.c-4.ap-southeast-1.aws.neon.tech/neondb?sslmode=require}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:neondb_owner}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:npg_e0DJuCAWcy3o}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate Settings for Neon Postgres
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# JWT Secret Configuration
jwt.secret=${JWT_SECRET:SuperSecretKeyForJobSeekingPlatformJwtTokenGenerator2026!}
jwt.expiration.ms=86400000

# Spring Mail Setup for OTP & Password Resets
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:your-email@gmail.com}
spring.mail.password=${MAIL_PASSWORD:your-app-password}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Google OAuth Client ID
google.client.id=${GOOGLE_CLIENT_ID:your-google-client-id.apps.googleusercontent.com}
